# Podiom system configuration.
#
# This file was generated on first run. It is yours to edit — Podiom reads it on
# start. Schedules and projects are NOT configured here: schedules are
# self-describing markdown files under ~/.podiom/schedules/, and projects live in
# the shared ledger at ~/.podiom/projects/projects.yaml.
#
# All Podiom state lives under a single root (default ~/.podiom/, override with
# the PODIOM_HOME environment variable).

# ---------------------------------------------------------------------------
# global: defaults applied across all agents unless an agent overrides them.
# ---------------------------------------------------------------------------
global:
  provider: claude            # default backend for new agents: claude | codex
  model: ""                   # default model name (empty = provider/CLI default)
  effort: medium              # default provider-supported reasoning effort
  permission_mode: approve    # approve (relay each side-effect to you) | yolo (auto-approve, whole-machine)
  permission_timeout: 3m       # approve-mode prompt timeout before auto-deny (Go duration, e.g. 30s, 3m)
  auto_archive_days: 7         # archive inactive sessions after this many days
  # Optional global fallback chain used when an agent declares none of its own.
  # Each entry is a profile name, a bare provider ("claude"/"codex", no profile),
  # or "default" (the agent's own provider with the CLI's global login).
  # On rate limit, Podiom steps to the next target and replays history. A chain
  # may mix providers (Claude -> Codex). See docs for details.
  fallback: []                # e.g. [work, personal, codex-main, codex]

# ---------------------------------------------------------------------------
# github: OPTIONAL. Omit this block entirely and Podiom uses its official
# GitHub App (podiom) to connect and sync project repos — no
# setup needed. Only set these fields if you want to register and use your OWN
# GitHub App instead. Values are public identifiers and safe to ship; do NOT
# put private keys or client secrets here.
# ---------------------------------------------------------------------------
github:
  app_slug: podiom  # GitHub App slug (defaults to Podiom's official App)
  client_id: Iv23liIKvhvRj9FdIaPD  # public GitHub App client ID (defaults to Podiom's official App)

# ---------------------------------------------------------------------------
# marketplace: OPTIONAL. Configures the skill search & install feature. Every
# field here is a non-secret setting with a sane default — omit the block to
# accept them all. The SkillsMP API key is a SECRET and is NEVER read from here:
# set PODIOM_SKILLSMP_API_KEY or write it to a 0600 file at
# ~/.podiom/marketplace/skillsmp.key. Anonymous access works without a key.
# ---------------------------------------------------------------------------
# marketplace:
#   registries: [skillsmp, anthropics, github]  # which sources are enabled (empty = all)
#   curated_only: false          # restrict installs to Verified (anthropics) sources
#   max_skill_size_mb: 50        # per-skill download cap
#   search_cache_minutes: 15     # server-side search cache TTL
#   detail_cache_hours: 24       # server-side detail cache TTL
#   github_token: ""             # optional PUBLIC token to raise anonymous GitHub rate limits

# ---------------------------------------------------------------------------
# profiles: OPTIONAL named auth contexts, each 1:1 with one underlying account.
# A profile is just a directory + a name that Podiom owns — Podiom never handles
# credentials. You log in yourself against the profile dir using the CLI's own
# auth flow (e.g. CLAUDE_CONFIG_DIR=<dir> claude login).
# Omit a profile on an agent to use the CLI's normal global login (no env set).
# ---------------------------------------------------------------------------
profiles: []
  # - name: work
  #   provider: claude
  #   config_dir: ~/.podiom/profiles/claude-work     # exported as CLAUDE_CONFIG_DIR
  # - name: personal
  #   provider: claude
  #   config_dir: ~/.podiom/profiles/claude-personal
  # - name: codex-main
  #   provider: codex
  #   home_dir: ~/.podiom/profiles/codex-main         # exported as CODEX_HOME

# ---------------------------------------------------------------------------
# agents: named colleagues maintained by Podiom. Each gets a directory under
# ~/.podiom/agents/<name>/ (SOUL.md identity, optional AGENTS.md instructions,
# and a workspace/ used as the agent's working directory). Defaults below are
# inherited from `global` unless set here.
# ---------------------------------------------------------------------------
agents: []
  # - name: jared
  #   provider: claude
  #   profile: work               # omit to use the CLI's global login (default)
  #   model: ""
  #   effort: medium
  #   permission_mode: approve    # per-agent override of the global default
  #   fallback: [work, personal, codex]   # ordered; rate-limit -> next target
  #                                       # entries: profile name | claude | codex | default
  #   mcp_servers: [github, filesystem]   # opt-in per-agent MCP server assignments

# ---------------------------------------------------------------------------
# voice: OPTIONAL. Enables voice input — a microphone button in chat and in the
# task/goal prompt fields that transcribes speech with the OpenAI Whisper API.
# The key is used server-side only and never sent to the browser, but note it
# is a SECRET stored here in plain text. Prefer setting PODIOM_OPENAI_API_KEY
# or OPENAI_API_KEY in the daemon's environment to keep it out of this file;
# the environment variables take precedence. Editable from Settings in the UI.
# ---------------------------------------------------------------------------
# voice:
#   openai_api_key: ""

# ---------------------------------------------------------------------------
# server: the local web UI / API bind address. Keep it on loopback unless you
# know you want it exposed (single-user, local deployment is the v1 assumption).
#
# Every API/WebSocket client must present the gateway token, auto-generated on
# first start and stored at $PODIOM_HOME/gateway.token. Retrieve it with
# `podiom token show`; rotate it with `podiom token rotate` (browsers are then
# prompted again; the CLI picks the new value up from disk automatically).
#
# allow_from (optional) restricts which source IPs/CIDRs may connect at all —
# useful when bind is not loopback. Loopback is always allowed; omit for no
# restriction. Example:
#   allow_from: ["192.168.1.0/24"]
#
# advertise (default true) announces this daemon on the local network over
# mDNS/DNS-SD so the Podiom mobile apps can find it without being told an
# address. It is skipped automatically while bind is loopback, since no other
# device could reach the advertised address. Set to false to stop announcing.
# ---------------------------------------------------------------------------
server:
  bind: 127.0.0.1
  port: 8787

# ---------------------------------------------------------------------------
# logging: daemon-owned structured logs. Logs are written under
# ~/.podiom/logs/ by default, or $PODIOM_HOME/logs when PODIOM_HOME is set.
# ---------------------------------------------------------------------------
logging:
  level: info                 # debug | info | warn | error
  retention_days: 7           # keep this many calendar days of daemon logs
