<!-- Android adaptive-icon foreground: the white mark on transparency.

     Sizing here has to account for a second shrink downstream. @capacitor/assets
     wraps this drawable in <inset android:inset="16.7%"> in mipmap-anydpi-v26/
     ic_launcher.xml, so only 66.6% of the canvas survives, and launchers then
     crop to a mask about 66dp across on the 108dp canvas.

     At 53% of this canvas the mark lands at ~35% of the 108dp canvas, which is
     58% of the visible mask — the same proportion the mark occupies in
     icon-only.svg, so the two platforms read at matching weight. It also stays
     well inside the 66dp safe zone under every mask shape. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g transform="translate(139.6, 147.1) scale(16.55)">
    <path d="M8 31 Q18 6 30 16" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round" />
    <circle cx="30" cy="16" r="4.8" fill="#fff" />
    <circle cx="36" cy="23" r="2.9" fill="#fff" opacity=".72" />
  </g>
</svg>
