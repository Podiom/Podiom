<!-- iOS app icon and Android legacy icon: brand gradient with the white mark.
     Square and fully opaque on purpose — iOS and Android both apply their own
     corner mask, so rounding it here would round it twice.

     The mark is the 48-unit drawing from web/public/favicon.svg. Its ink spans
     x 6.1-38.9 and y 11.2-32.9, so it is neither square nor centred in its own
     box; the transform below scales that ink to 58% of the canvas and centres
     the ink itself rather than the 48-unit box. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46A08C" />
      <stop offset="1" stop-color="#2F6E60" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#g)" />
  <g transform="translate(104.5, 112.7) scale(18.11)">
    <path d="M8 31 Q18 6 30 16" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round" />
    <circle cx="30" cy="16" r="4.8" fill="#fff" />
    <circle cx="36" cy="23" r="2.9" fill="#fff" opacity=".72" />
  </g>
</svg>
