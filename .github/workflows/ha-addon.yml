name: ha-addon

on:
  workflow_run:
    workflows:
      - release
    branches:
      - master
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, for example v0.1.61"
        required: true
        type: string
      ref:
        description: "Git ref to build"
        required: true
        default: master
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ha-addon-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Home Assistant add-on binaries
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      addon_version: ${{ steps.metadata.outputs.addon_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      # 22 is the floor for @capacitor/cli, which the root `npm install` in
      # `make web` pulls in. One lockfile at the root covers the web workspace.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve build metadata
        id: metadata
        env:
          VERSION: ${{ github.event_name == 'workflow_run' && format('v0.1.{0}', github.event.workflow_run.run_number) || inputs.version }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "addon_version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "commit=${target_sha::7}" >> "$GITHUB_OUTPUT"

      # CROSS_OS=linux because ha/Dockerfile COPYs only from bin/linux-${TARGETARCH}
      # and ha/Dockerfile.dockerignore excludes everything else from the build
      # context. The default matrix would also cross-compile darwin and windows —
      # eight binaries that are discarded here and that release.yml already
      # published minutes earlier. CROSS_ARCH keeps its default: the image needs
      # both amd64 and arm64.
      - name: Build web and Linux binaries
        run: |
          make web
          make cross CROSS_OS=linux \
            VERSION="${{ steps.metadata.outputs.version }}" \
            COMMIT="${{ steps.metadata.outputs.commit }}"

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: ha-linux-binaries
          path: |
            bin/linux-amd64/podiom
            bin/linux-amd64/podiomd
            bin/linux-arm64/podiom
            bin/linux-arm64/podiomd
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build Home Assistant add-on (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: ha-linux-binaries
          path: bin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only amd64 is loaded into Docker because it is the architecture exercised
      # by the smoke test. Its layers remain in this job's BuildKit instance, so
      # the digest push after the test does not rebuild them.
      - name: Build amd64 smoke image
        if: matrix.arch == 'amd64'
        env:
          ADDON_VERSION: ${{ needs.prepare.outputs.addon_version }}
        run: |
          set -euo pipefail
          set -a; . ha/versions.env; set +a
          build_args=$(sed -n 's/^\([A-Z_][A-Z0-9_]*\)=.*/--build-arg \1/p' ha/versions.env)
          docker buildx build --load \
            --platform linux/amd64 \
            -f ha/Dockerfile \
            $build_args \
            --cache-from type=registry,ref=ghcr.io/podiom/podiom-ha:buildcache-amd64 \
            --cache-from type=registry,ref=ghcr.io/podiom/podiom-ha:buildcache \
            --build-arg PODIOM_VERSION="$ADDON_VERSION" \
            -t "ghcr.io/podiom/podiom-ha:smoke" .

      - name: Smoke test amd64 image
        if: matrix.arch == 'amd64'
        run: bash ha/test/smoke.sh ghcr.io/podiom/podiom-ha:smoke

      # One cache ref per architecture is required: exporting a multi-platform
      # registry cache to one image manifest repeatedly restored only amd64 in
      # practice, leaving every arm64 dependency layer to run under QEMU. These
      # builds run natively and write independent manifests instead. The old ref
      # is read only as a migration fallback.
      #
      # Registry rather than type=gha deliberately: these layers are ~1 GB across
      # both architectures and would compete with the repository's Go, npm and
      # Gradle entries for the shared Actions cache allowance. mode=max retains
      # this single-stage Dockerfile's intermediate dependency layers.
      - name: Build and push image by digest
        env:
          ADDON_VERSION: ${{ needs.prepare.outputs.addon_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          set -a; . ha/versions.env; set +a
          build_args=$(sed -n 's/^\([A-Z_][A-Z0-9_]*\)=.*/--build-arg \1/p' ha/versions.env)
          metadata_file="${RUNNER_TEMP}/image-metadata.json"
          docker buildx build \
            --platform "linux/${ARCH}" \
            -f ha/Dockerfile \
            $build_args \
            --cache-from "type=registry,ref=ghcr.io/podiom/podiom-ha:buildcache-${ARCH}" \
            --cache-from type=registry,ref=ghcr.io/podiom/podiom-ha:buildcache \
            --cache-to "type=registry,ref=ghcr.io/podiom/podiom-ha:buildcache-${ARCH},mode=max,image-manifest=true,oci-mediatypes=true" \
            --build-arg PODIOM_VERSION="$ADDON_VERSION" \
            --output type=image,name=ghcr.io/podiom/podiom-ha,push-by-digest=true,name-canonical=true,push=true \
            --metadata-file "$metadata_file" .

          digest="$(jq -er '."containerimage.digest"' "$metadata_file")"
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: ha-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Home Assistant add-on
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: ha-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch add-on image
        env:
          ADDON_VERSION: ${{ needs.prepare.outputs.addon_version }}
        run: |
          set -euo pipefail
          image="ghcr.io/podiom/podiom-ha"
          mapfile -t digests < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "expected two image digests, found ${#digests[@]}" >&2
            exit 1
          fi

          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid image digest: $digest" >&2; exit 1; }
            sources+=("${image}@sha256:${digest}")
          done

          docker buildx imagetools create \
            -t "${image}:${ADDON_VERSION}" \
            -t "${image}:latest" \
            "${sources[@]}"

          platforms="$(docker buildx imagetools inspect --raw "${image}:${ADDON_VERSION}" | \
            jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"' | \
            sort -u)"
          expected_platforms="$(printf 'linux/amd64\nlinux/arm64')"
          if [ "$platforms" != "$expected_platforms" ]; then
            echo "unexpected image platforms:" >&2
            printf '%s\n' "$platforms" >&2
            exit 1
          fi

      - name: Publish add-on to Podiom/homeassistant-addons
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ADDON_REPO_TOKEN: ${{ secrets.ADDON_REPO_TOKEN }}
        run: |
          set -euo pipefail
          addon_version="${VERSION#v}"
          repo_dir="${RUNNER_TEMP}/homeassistant-addons"
          target_sha="$(git rev-parse HEAD)"

          git clone --depth 1 \
            "https://x-access-token:${ADDON_REPO_TOKEN}@github.com/Podiom/homeassistant-addons.git" \
            "$repo_dir"

          old_changelog="${RUNNER_TEMP}/old-changelog.md"
          if [ -f "$repo_dir/podiom/CHANGELOG.md" ]; then
            tail -n +2 "$repo_dir/podiom/CHANGELOG.md" > "$old_changelog"
          else
            tail -n +2 ha/addon/CHANGELOG.md > "$old_changelog"
          fi

          mkdir -p "$repo_dir/podiom"
          rsync -a --delete --exclude CHANGELOG.md ha/addon/ "$repo_dir/podiom/"

          ADDON_VERSION="$addon_version" \
            yq -i '.version = strenv(ADDON_VERSION)' "$repo_dir/podiom/config.yaml"

          previous_tag="$(git tag --merged "$target_sha" --list 'v0.1.*' --sort=-version:refname | grep -v "^${VERSION}$" | head -n 1 || true)"
          if [ -n "$previous_tag" ]; then range="${previous_tag}..${target_sha}"; else range="${target_sha}"; fi
          {
            echo "# Changelog"
            echo
            echo "## ${addon_version} - $(date -u +%Y-%m-%d)"
            echo
            git log --reverse --format='- %s' "$range"
            echo
            echo "### Bundled versions"
            echo
            sed -n 's/^\([A-Z_][A-Z0-9_]*\)=\(.*\)/- \1: \2/p' ha/versions.env | grep -v SHA256
            echo
            echo "> Compare with the previous entry for CLI version drift; CLI flags"
            echo "> Podiom depends on (e.g. --mcp-config, --add-dir, --profile) are"
            echo "> version-sensitive."
            echo
          } | cat - "$old_changelog" > "$repo_dir/podiom/CHANGELOG.md"

          cd "$repo_dir"
          git config user.name "podiom-release[bot]"
          git config user.email "podiom-release[bot]@users.noreply.github.com"
          git add podiom
          git commit -m "Podiom ${addon_version}"
          git push
