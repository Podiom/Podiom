name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Test
        run: |
          go test ./...
          go vet ./...
          npm run check --prefix web

      - name: Compute release version
        id: version
        run: |
          version="v0.1.${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Package cross-platform binaries
        run: make package VERSION="${{ steps.version.outputs.version }}" COMMIT="${{ steps.version.outputs.commit }}"

      - name: Add latest-compatible asset names
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          for os in linux darwin; do
            for arch in amd64 arm64; do
              cp "dist/podiom_${version}_${os}_${arch}.tar.gz" "dist/podiom_${os}_${arch}.tar.gz"
            done
          done
          for arch in amd64 arm64; do
            cp "dist/podiom_${version}_windows_${arch}.zip" "dist/podiom_windows_${arch}.zip"
          done
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          (cd dist && sha256sum podiom_* install.sh install.ps1 > SHA256SUMS)

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          previous_tag="$(git tag --merged "$GITHUB_SHA" --list 'v0.1.*' --sort=-version:refname | grep -v "^${VERSION}$" | head -n 1 || true)"
          {
            echo "# Podiom ${VERSION}"
            echo
            echo "Target commit: \`${GITHUB_SHA}\` (${COMMIT})"
            echo
            if [ -n "$previous_tag" ]; then
              echo "Previous release: \`${previous_tag}\`"
              echo "Range: \`${previous_tag}..${GITHUB_SHA}\`"
              range="${previous_tag}..${GITHUB_SHA}"
            else
              echo "Previous release: none"
              echo "Range: initial release through \`${GITHUB_SHA}\`"
              range="${GITHUB_SHA}"
            fi
            echo
            echo "## Commits"
            git log --reverse --format='- %s (`%h`)' "$range"
          } > "$notes_file"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          gh release delete "$VERSION" --yes --cleanup-tag || true
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --latest \
            --title "$VERSION" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"

      # --- Home Assistant add-on image + repository bump (plan B3) ----------
      # Reuses bin/linux-{amd64,arm64} produced by `make package` above, so the
      # container ships binaries byte-identical to the GitHub release assets.

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 add-on image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          set -a; . ha/versions.env; set +a
          build_args=$(sed -n 's/^\([A-Z_][A-Z0-9_]*\)=.*/--build-arg \1/p' ha/versions.env)
          docker buildx build --load \
            --platform linux/amd64 \
            -f ha/Dockerfile \
            $build_args \
            --build-arg PODIOM_VERSION="${VERSION#v}" \
            -t "ghcr.io/podiom/podiom-ha:smoke" .

      - name: Smoke test add-on image
        run: bash ha/test/smoke.sh ghcr.io/podiom/podiom-ha:smoke

      - name: Push multi-arch add-on image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          set -a; . ha/versions.env; set +a
          build_args=$(sed -n 's/^\([A-Z_][A-Z0-9_]*\)=.*/--build-arg \1/p' ha/versions.env)
          addon_version="${VERSION#v}"
          # amd64 layers come from the buildx cache of the smoke build; only
          # the apt/npm/pipx layers of arm64 run under QEMU emulation.
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            -f ha/Dockerfile \
            $build_args \
            --build-arg PODIOM_VERSION="${addon_version}" \
            -t "ghcr.io/podiom/podiom-ha:${addon_version}" \
            -t "ghcr.io/podiom/podiom-ha:latest" .

      - name: Publish add-on to Podiom/homeassistant-addons
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ADDON_REPO_TOKEN: ${{ secrets.ADDON_REPO_TOKEN }}
        run: |
          set -euo pipefail
          addon_version="${VERSION#v}"
          repo_dir="${RUNNER_TEMP}/homeassistant-addons"

          git clone --depth 1 \
            "https://x-access-token:${ADDON_REPO_TOKEN}@github.com/Podiom/homeassistant-addons.git" \
            "$repo_dir"

          # Preserve the add-on repo's accumulated changelog (ha/addon/CHANGELOG.md
          # is only a seed); everything else is rendered fresh from ha/addon/.
          old_changelog="${RUNNER_TEMP}/old-changelog.md"
          if [ -f "$repo_dir/podiom/CHANGELOG.md" ]; then
            tail -n +2 "$repo_dir/podiom/CHANGELOG.md" > "$old_changelog"
          else
            tail -n +2 ha/addon/CHANGELOG.md > "$old_changelog"
          fi

          mkdir -p "$repo_dir/podiom"
          rsync -a --delete --exclude CHANGELOG.md ha/addon/ "$repo_dir/podiom/"

          ADDON_VERSION="$addon_version" \
            yq -i '.version = strenv(ADDON_VERSION)' "$repo_dir/podiom/config.yaml"

          # Changelog entry: commits since the previous tag + the bundled pins
          # from ha/versions.env (HA18: CLI flag drift must be visible).
          previous_tag="$(git tag --merged "$GITHUB_SHA" --list 'v0.1.*' --sort=-version:refname | grep -v "^${VERSION}$" | head -n 1 || true)"
          if [ -n "$previous_tag" ]; then range="${previous_tag}..${GITHUB_SHA}"; else range="${GITHUB_SHA}"; fi
          {
            echo "# Changelog"
            echo
            echo "## ${addon_version} - $(date -u +%Y-%m-%d)"
            echo
            git log --reverse --format='- %s' "$range"
            echo
            echo "### Bundled versions"
            echo
            sed -n 's/^\([A-Z_][A-Z0-9_]*\)=\(.*\)/- \1: \2/p' ha/versions.env | grep -v SHA256
            echo
            echo "> Compare with the previous entry for CLI version drift; CLI flags"
            echo "> Podiom depends on (e.g. --mcp-config, --add-dir, --profile) are"
            echo "> version-sensitive."
            echo
          } | cat - "$old_changelog" > "$repo_dir/podiom/CHANGELOG.md"

          cd "$repo_dir"
          git config user.name "podiom-release[bot]"
          git config user.email "podiom-release[bot]@users.noreply.github.com"
          git add podiom
          git commit -m "Podiom ${addon_version}"
          git push
