name: ci

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run Svelte check
        run: npm run check --prefix web

  ha-smoke:
    name: Home Assistant add-on smoke
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web and Linux binaries
        run: |
          make web
          mkdir -p bin/linux-amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS:-}" -o bin/linux-amd64/podiomd ./cmd/podiomd
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS:-}" -o bin/linux-amd64/podiom ./cmd/podiom

      - name: Build amd64 add-on image
        run: |
          set -euo pipefail
          set -a; . ha/versions.env; set +a
          build_args=$(sed -n 's/^\([A-Z_][A-Z0-9_]*\)=.*/--build-arg \1/p' ha/versions.env)
          docker buildx build --load \
            --platform linux/amd64 \
            -f ha/Dockerfile \
            $build_args \
            --build-arg PODIOM_VERSION="ci-${GITHUB_SHA::7}" \
            -t "podiom-ha:ci" .

      - name: Smoke test add-on image
        run: bash ha/test/smoke.sh podiom-ha:ci
