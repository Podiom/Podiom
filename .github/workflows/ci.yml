name: ci

on:
  pull_request:
  push:
    branches:
      - master
  # Monday 04:17 UTC: the weekly cold add-on image build. The layer cache the
  # ha-smoke job normally reads would otherwise freeze the Debian package set and
  # stop pipx re-resolving mcp-proxy's transitive deps — the break that 9da70e9
  # and 84933c1 existed to fix. This run is what keeps catching that class of bug.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 22 is the floor for @capacitor/cli, which a root `npm install` pulls in.
  NODE_VERSION: "22"
  GO_VERSION: "1.26.x"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The action's own cache is deliberately off. Its key is go.sum plus the
          # exact Go patch version with no restore-keys, which fails both ways: a
          # runner-image Go bump misses stone cold, and an unchanged go.sum hits the
          # key exactly so the action never *saves* — GOCACHE freezes at the last
          # dependency change and `go test` reports nothing as cached.
          cache: false

      - name: Restore Go build and module cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run Svelte check
        run: npm run check -w web

      # Pure-logic tests for the pieces where a mistake is silent: hash parsing and
      # formatting, and the mapping from a notification to a destination. A wrong
      # route does not throw — it just lands on the wrong page.
      - name: Run web tests
        run: npm test -w web

      # Saved only on master, so the cache accumulates along one lineage instead of
      # adding an entry per pull-request commit and evicting the npm and Gradle
      # caches from the repo's shared 10 GB budget. `always()` because a red run's
      # compiled packages are exactly what its successor wants warm.
      - name: Save Go build and module cache
        uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  # The two mobile jobs are what R12 asks for: prove that a change to the shared
  # Svelte app still produces valid native projects. Neither needs signing
  # credentials, so both run on ordinary pull requests.
  #
  # None of the three jobs below consumes an output of `test` — each checks out and
  # installs on its own — so none of them gates on it and all four run in parallel.
  # A failing Go test therefore also spends the mobile and Docker jobs, which is
  # free on a public repo, and cancel-in-progress still kills a superseded push.
  android:
    name: Android build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Sync Android project
        run: npx cap sync android

      # The doctor is scoped to this job's platform and runs after the sync, for
      # two reasons. An unqualified `cap doctor` audits every committed platform,
      # so the Linux runner fails on the iOS check with "Xcode is not installed".
      # And the Android check asserts app/src/main/assets exists, which is
      # gitignored — the sync above is what creates it.
      - name: Validate Capacitor configuration
        run: npx cap doctor android

      - name: Check the committed project is in sync
        run: .github/scripts/check-native-sync.sh android

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

  ios:
    name: iOS build
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Sync iOS project
        run: npx cap sync ios

      # Scoped and ordered to match the Android job above: an unqualified
      # `cap doctor` would fail here on the Android check instead.
      - name: Validate Capacitor configuration
        run: npx cap doctor ios

      - name: Check the committed project is in sync
        run: .github/scripts/check-native-sync.sh ios

      # Package.resolved pins 15 remote packages headed by firebase-ios-sdk, gRPC
      # and abseil, re-cloned on every run. Only the clones are cached, not
      # DerivedData: Xcode does not reliably reuse DerivedData across runners, and a
      # half-valid one fails in ways that read as a source problem. The cache lives
      # under $HOME rather than in the tree so it cannot put an untracked directory
      # under ios/ where check-native-sync.sh looks.
      - name: Cache Swift package clones
        uses: actions/cache@v4
        with:
          path: ~/.spm-clones
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Capacitor 8 resolves iOS plugins through Swift Package Manager, so there
      # is no CocoaPods step and no .xcworkspace — the project builds directly.
      # CODE_SIGNING_ALLOWED=NO keeps signing secrets out of pull-request CI.
      - name: Build for simulator
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath ~/.spm-clones \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: ios/App

  ha-smoke:
    name: Home Assistant add-on smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web and Linux binaries
        run: |
          make web
          make cross CROSS_OS=linux CROSS_ARCH=amd64 \
            VERSION="ci-${GITHUB_SHA::7}" COMMIT="${GITHUB_SHA::7}"

      # cache-from only, never cache-to: a pull request must not be able to poison
      # the layer cache that the release build consumes, and a fork PR's read-only
      # GITHUB_TOKEN could not write it anyway. ghcr.io/podiom/podiom-ha is a public
      # package, so the read needs no login step and no change to `permissions`.
      # ha-addon.yml is what populates this ref.
      #
      # --no-cache on the weekly schedule instead: neither `apt-get install` nor
      # `pipx install mcp-proxy` pins what it resolves, so a permanently warm cache
      # would quietly stop verifying both. See the `schedule` trigger above.
      - name: Build amd64 add-on image
        env:
          CACHE_ARGS: ${{ github.event_name == 'schedule' && '--no-cache' || '--cache-from type=registry,ref=ghcr.io/podiom/podiom-ha:buildcache' }}
        run: |
          set -euo pipefail
          set -a; . ha/versions.env; set +a
          build_args=$(sed -n 's/^\([A-Z_][A-Z0-9_]*\)=.*/--build-arg \1/p' ha/versions.env)
          docker buildx build --load \
            --platform linux/amd64 \
            -f ha/Dockerfile \
            $build_args \
            $CACHE_ARGS \
            --build-arg PODIOM_VERSION="ci-${GITHUB_SHA::7}" \
            -t "podiom-ha:ci" .

      - name: Smoke test add-on image
        run: bash ha/test/smoke.sh podiom-ha:ci
